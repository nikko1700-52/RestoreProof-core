name: Bug report
description: Something does not work, or RestoreProof was wrong about a recovery
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Security issues do not belong here.** Please use the Security tab →
        *Report a vulnerability* instead. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The most useful thing you can send is a minimal scenario.
        `restoreproof plan` output is safe to paste: it never contains secrets.
      render: shell
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version and environment
      description: Output of `restoreproof version`, `docker compose version`, and your OS.
      render: shell
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Report (optional)
      description: |
        The JSON report, if one was produced. **Redact anything specific to your
        data first** — reports contain table names, row counts and error
        messages from your backup.
      render: json
