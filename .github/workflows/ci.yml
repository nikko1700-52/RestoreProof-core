name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # GitHub-hosted Linux runners ship Docker with the Compose v2 plugin, so
      # the full drill tests run for real here rather than being skipped.
      - name: Show the container runtime
        run: |
          docker compose version
          docker info --format '{{.ServerVersion}}'

      - run: cargo test --workspace --all-features

  drill:
    name: End-to-end drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Pre-pull images
        run: docker pull postgres:16-alpine && docker pull nginx:1.27-alpine

      # A drill that is supposed to pass must pass.
      - name: postgres-local should PASS
        env:
          RESTOREPROOF_DEMO_DATABASE_URL: postgres://restoreproof:restoreproof-local-drill@127.0.0.1:15432/app
        run: ./target/release/restoreproof run --config examples/postgres-local/restoreproof.yaml

      # And a drill that is supposed to fail must fail, with exit code 1.
      # A tool that only ever prints green proves nothing.
      - name: postgres-local failing scenario should FAIL with exit code 1
        env:
          RESTOREPROOF_DEMO_DATABASE_URL: postgres://restoreproof:restoreproof-local-drill@127.0.0.1:15432/app
        run: |
          set +e
          ./target/release/restoreproof run --config examples/postgres-local/restoreproof.failing.yaml
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1, got $code" >&2
            exit 1
          fi

      - name: docker-compose-app should PASS
        run: ./target/release/restoreproof run --config examples/docker-compose-app/restoreproof.yaml

      - name: Every report must verify
        run: |
          for report in examples/*/reports/*.json; do
            ./target/release/restoreproof report "$report" --verify
          done

      - name: The JUnit and Prometheus reports must be parseable
        run: |
          python3 - <<'PY'
          import glob, re, sys
          import xml.etree.ElementTree as ET

          junit = glob.glob("examples/*/reports/*.junit.xml")
          assert junit, "no JUnit report was written"
          for path in junit:
              root = ET.parse(path).getroot()
              assert root.tag == "testsuites", path
              assert root.findall(".//testcase"), path

          prom = glob.glob("examples/*/reports/*.prom")
          assert prom, "no Prometheus report was written"
          sample = re.compile(r"^[a-zA-Z_:][a-zA-Z0-9_:]*\{[^}]*\} -?[0-9.eE+-]+$")
          for path in prom:
              for line in open(path):
                  line = line.rstrip("\n")
                  if line and not line.startswith("#") and not sample.match(line):
                      sys.exit(f"unparseable sample in {path}: {line}")
          print("JUnit and Prometheus output parse cleanly")
          PY

      - name: Comparing a report with itself must report no regression
        run: |
          report=$(ls examples/postgres-local/reports/*.json | head -1)
          ./target/release/restoreproof diff "$report" "$report"

      - name: Strict validation must be available
        run: |
          ./target/release/restoreproof validate \
            --config examples/docker-compose-app/restoreproof.yaml --strict

      - name: No recovery environment may be left behind
        run: |
          leftovers=$(docker ps -a --filter "name=-rp-" --format '{{.Names}}')
          if [ -n "$leftovers" ]; then
            echo "leftover containers: $leftovers" >&2
            exit 1
          fi

      - name: Publish the drill as a test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: examples/*/reports/*.junit.xml
          fail_on_failure: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drill-reports
          path: examples/*/reports/

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  edition-boundary:
    name: Open-source guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # PREMIUM.md promises that this edition has no licence check, no feature
      # flag and no telemetry. A promise in a Markdown file decays; this makes
      # it a build failure.
      - run: cargo test -p restoreproof-cli --test open_source_guarantees

  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
