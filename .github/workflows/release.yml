name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Both entry points end up here: a pushed tag names itself, a manual run says
  # which tag it is building. Reading `github.ref_name` alone meant a manual run
  # silently built a release called `main`.
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p restoreproof-cli

      - name: Package
        run: |
          # The directory inside carries the version, for provenance once it is
          # unpacked. The asset does not: a fixed name is what makes the
          # `releases/latest/download/...` URL in the README work at every
          # release instead of rotting at the next one.
          inner="restoreproof-${VERSION}-${{ matrix.target }}"
          asset="restoreproof-${{ matrix.target }}"
          mkdir -p "dist/$inner"
          cp "target/${{ matrix.target }}/release/restoreproof" "dist/$inner/"
          cp README.md LICENSE SECURITY.md CHANGELOG.md "dist/$inner/"
          tar -czf "dist/$asset.tar.gz" -C dist "$inner"
          ( cd dist && sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Refuse to publish anything that is not a version
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) echo "publishing $VERSION" ;;
            *) echo "::error::refusing to publish \`$VERSION\`: a release is \
               named vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac

      - name: Collect checksums
        run: |
          mkdir -p dist
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ( cd dist && sha256sum *.tar.gz > SHA256SUMS )
          cat dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          # Named explicitly rather than inferred from the ref, so a manual run
          # publishes the tag it was asked for — creating it if it does not
          # exist yet — instead of whatever branch it happened to run on.
          tag_name: ${{ env.VERSION }}
          name: RestoreProof Core ${{ env.VERSION }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            Verify a download before running it:

            ```bash
            sha256sum --check SHA256SUMS --ignore-missing
            ```

            One static binary, no runtime dependency. Drills need Docker with
            the Compose v2 plugin on the machine that runs them.
