version: 1

defaults:
  timeout_seconds: 20
  retry:
    attempts: 20
    delay_seconds: 2

checks:
  - id: dump-restored
    name: "restic restored the dump"
    type: file
    required: true
    base: restore
    path: dump.sql
    min_size_bytes: 200

  - id: database-healthy
    name: "PostgreSQL reports healthy"
    type: container
    required: true
    service: database
    state: healthy

  - id: orders-present
    name: "The orders table contains data"
    type: sql
    required: true
    dsn_env: RESTOREPROOF_DEMO_DATABASE_URL
    query: "SELECT count(*) FROM orders"
    min_value: 1

  - id: latest-order
    name: "The most recent order came back"
    type: sql
    required: false
    dsn_env: RESTOREPROOF_DEMO_DATABASE_URL
    query: "SELECT customer FROM orders ORDER BY id DESC LIMIT 1"
    expect_value: "ada"
