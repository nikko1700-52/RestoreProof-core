# The isolated environment this drill restores into.
#
# RestoreProof audits this file before starting anything: privileged
# containers, the Docker socket, host namespaces, dangerous capabilities,
# mounts that leave this directory and ports published on 0.0.0.0 are all
# refused. See docs/security.md.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: restoreproof
      # A throwaway credential for a throwaway container.
      POSTGRES_PASSWORD: restoreproof-local-drill
    volumes:
      # Injected by RestoreProof: the directory the backup was restored into.
      - ${RESTOREPROOF_RESTORE_DIR}:/docker-entrypoint-initdb.d:ro
    # Loopback only. The restored copy of production data must not be
    # reachable from anywhere but this machine.
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoreproof -d app"]
      interval: 2s
      timeout: 3s
      retries: 30
